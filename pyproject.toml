[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-satisfaction"
version = "0.1.0"
description = "Airline passenger satisfaction prediction (Kaggle Playground S6E10)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "lightgbm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
